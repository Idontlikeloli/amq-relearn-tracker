<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AMQ Relearn Tracker</title>
  <link rel="icon" type="image/jpeg" href="https://amq-stats-api.yarthepro.workers.dev/tabicon.jpeg">
  <link rel="preload" href="https://amq-stats-api.yarthepro.workers.dev/final_compressed.mp4" as="video" type="video/mp4" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-page">

<div class="login-shell">
  <div class="login-box">
    <div class="login-main">
      <h1>AMQ Relearn Tracker</h1>
      <p class="login-subtitle">
        Works for any tour player.
        <span class="login-feedback-link-wrap">(<a href="https://forms.gle/VqiTvvUPwTTyCTb96" target="_blank" rel="noopener noreferrer">Feedback form</a>)</span>
      </p>

      <form id="loginForm" novalidate>
        <div class="login-username-wrap">
          <input id="username" placeholder="Enter username" autocomplete="username" autofocus>
          <div id="loginUsernameSuggestion" class="login-username-inline-suggestion" aria-hidden="true"></div>
        </div>
        <button type="submit">Enter Dashboard</button>
      </form>

      <p id="error" class="login-error"></p>
    </div>

    <div class="login-data-dates" aria-label="Data freshness information">
      <div id="loginDataUpTo">Data up to February 1, 2026</div>
      <div id="loginCreditLine">Made by i_dont_like_loli, special thanks to all <span class="login-credit-tour-staff" tabindex="0" aria-label="Tour staff credits" data-tooltip="Thank you Dry, Comete, and arpia97 for processing stats 🙏">tour staff</span> for data</div>
      <div class="login-background-toggle" aria-label="Background image style">
        <button id="loginBgToggleBtn" class="login-bg-toggle-btn" type="button" aria-pressed="false">Do-not-click</button>
      </div>
    </div>
  </div>
</div>
<video id="loginBackgroundVideo" class="login-background-video" preload="auto" playsinline aria-hidden="true"></video>

<script src="js/login.js"></script>

</body>
</html>
